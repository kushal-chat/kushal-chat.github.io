# Rebuilds the blog whenever you push a change to posts/, templates/ or build.mjs,
# so adding a post is just: drop a .md file in posts/ and push.
name: Build site
on:
  push:
    paths: ['posts/**', 'templates/**', 'data/**', 'build.mjs']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node build.mjs
      - name: Commit generated pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Rebuild site" && git push)
